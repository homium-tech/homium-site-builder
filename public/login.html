<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homium Site Builder — Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rubik', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(74, 17, 112, 0.7) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(41, 6, 64, 0.6) 0%, transparent 65%),
        #0e0118;
      padding: 1.5rem;
    }

    .card {
      background: #290640;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 2.75rem 2.5rem 2.25rem;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Logo ── */
    .logo {
      display: flex;
      align-items: center;
      gap: 0;
      letter-spacing: 0.18em;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1.5rem;
      user-select: none;
    }
    .logo-bolt {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #00ffff;
      margin: 0 1px;
    }
    .logo-bolt svg { display: block; }

    /* ── Headline ── */
    .headline {
      font-size: 20px;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 0.4rem;
      text-align: center;
    }
    .headline em {
      font-style: italic;
      font-weight: 300;
      color: #00ffff;
    }

    .subtitle {
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 2rem;
      text-align: center;
    }

    /* ── Form ── */
    .form { width: 100%; display: flex; flex-direction: column; gap: 1.1rem; }

    .field { display: flex; flex-direction: column; gap: 0.4rem; }

    label {
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
    }

    input {
      background: #1a0530;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.85rem 1.1rem;
      font-family: inherit;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    input::placeholder { color: rgba(255, 255, 255, 0.3); }
    input:focus { border-color: rgba(0, 255, 255, 0.45); }

    /* ── Error ── */
    .error-msg {
      display: none;
      background: rgba(255, 59, 92, 0.12);
      border: 1px solid rgba(255, 59, 92, 0.3);
      color: #ff6b85;
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      font-size: 13px;
      text-align: center;
    }
    .error-msg.visible { display: block; }

    /* ── Button ── */
    button[type="submit"] {
      width: 100%;
      background: #00ffff;
      color: #0e0118;
      border: none;
      border-radius: 9999px;
      padding: 0.9rem;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.4rem;
      transition: opacity 0.2s, transform 0.1s;
    }
    button[type="submit"]:hover { opacity: 0.88; }
    button[type="submit"]:active { transform: scale(0.98); }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Footer ── */
    .footer-tag {
      margin-top: 1.5rem;
      font-size: 12.5px;
      color: #00ffff;
      opacity: 0.65;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span>H</span>
      <span class="logo-bolt">
        <svg width="11" height="15" viewBox="0 0 11 15" fill="none">
          <path d="M7 1L2 8.5H5.5L4 14L9.5 6H6L7 1Z" fill="#00ffff"/>
        </svg>
      </span>
      <span>MIUM</span>
    </div>

    <p class="headline">Site <em>Builder.</em></p>
    <p class="subtitle">Accede con tu cuenta para continuar.</p>

    <form class="form" id="loginForm" autocomplete="on">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input
          type="text"
          id="email"
          name="email"
          placeholder="tu@correo.com"
          autocomplete="username"
          required
        >
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="error-msg" id="errorMsg">Credenciales incorrectas. Inténtalo de nuevo.</div>

      <button type="submit" id="submitBtn">Entrar</button>
    </form>

    <span class="footer-tag">[ Homium Site Builder ]</span>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });

        if (res.ok) {
          window.location.href = '/';
        } else {
          errorMsg.classList.add('visible');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Entrar';
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch {
        errorMsg.textContent = 'Error de conexión. Verifica que el servidor esté activo.';
        errorMsg.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
